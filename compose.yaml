services:
  postgres:
    image: postgres:16-alpine
    container_name: opueh-postgres
    environment:
      POSTGRES_USER: opueh
      POSTGRES_PASSWORD: opueh
      POSTGRES_DB: opueh
    ports:
      - "5432:5432"
    volumes:
      - opueh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opueh -d opueh"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  opueh_pgdata:
